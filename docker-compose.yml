# Plate — the open-source quickstart (spec Q4: "the compose file IS the
# open-source quickstart"). `docker compose up` and a stranger has a working
# read-path Plate: the API, its own Postgres, and imgproxy for image transforms.
#
# Production points DATABASE_URL at Supabase and runs the worker on Cloud Run
# (spec Q4), but the SHIPPED compose file always includes a Postgres container so
# this works with nothing external — Supabase is our production choice, never a
# requirement baked into the project (spec Q4, managed Postgres note).
#
# The API runs the SAME migrations at boot that the test container runs, so the
# schema here is the one the isolation conformance test proved against — no drift.
services:
  plate-api:
    build: .
    command: ["serve"]
    ports:
      - "8080:8080"
    environment:
      PLATE_ENV: development
      PLATE_LOG_LEVEL: info
      PLATE_HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://plate:plate@postgres:5432/plate?sslmode=disable"
      # Image transforms via imgproxy (ONLY_PRESETS enforced in imgproxy).
      IMGPROXY_BASE_URL: "http://imgproxy:8080"
      # Storage: MinIO stands in for R2 in the quickstart (S3-compatible, spec Q5),
      # so `docker compose up` gives a full WRITE path with nothing external — the
      # same parity discipline as the goose migrations. Production points these at
      # R2 instead. Path-style addressing is required for MinIO.
      R2_ENDPOINT: "http://minio:9000"
      R2_REGION: "us-east-1"
      R2_ACCESS_KEY_ID: "plate"
      R2_SECRET_ACCESS_KEY: "plate-secret"
      R2_DEFAULT_BUCKET: "plate"
      R2_PUBLIC_BASE: "http://localhost:9000/plate"
      PLATE_S3_PATH_STYLE: "true"
      PLATE_UPLOAD_URL_TTL: "1h"
      # Token validation: supply a base64 raw Ed25519 public key. Empty here so a
      # stranger can boot and read the health endpoints; set it to accept tokens.
      PLATE_JWT_PUBLIC_KEY: "${PLATE_JWT_PUBLIC_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plate
      POSTGRES_PASSWORD: plate
      POSTGRES_DB: plate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plate -d plate"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - plate-pgdata:/var/lib/postgresql/data

  imgproxy:
    image: darthsim/imgproxy:latest
    environment:
      # Refuse ad-hoc params — intent presets only (spec §2). Presets are supplied
      # by the deployment; this is the lockdown that makes intent structural.
      IMGPROXY_ONLY_PRESETS: "true"
    ports:
      - "8081:8080"

  # MinIO is the R2 stand-in for the quickstart (S3-compatible, spec Q5). It is
  # NOT how production runs — production points the R2_* vars at Cloudflare R2 —
  # but shipping it means `docker compose up` gives a stranger a working write
  # path with nothing external, the same parity discipline as the Postgres
  # container and the goose migrations.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "plate"
      MINIO_ROOT_PASSWORD: "plate-secret"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - plate-miniodata:/data

  # One-shot: create the bucket so plate-api can presign into it on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 plate plate-secret &&
      mc mb --ignore-existing local/plate &&
      echo 'bucket ready'"

  # The transcode worker (spec §5.2, Q4): same binary as plate-api, the `work`
  # command, built from Dockerfile.worker (which carries ffmpeg — the api image
  # does not). It claims A/V jobs from Postgres (SKIP LOCKED), pulls originals
  # from MinIO, transcodes, and writes renditions back. Scales horizontally by
  # raising the replica count; SKIP LOCKED keeps N workers safe.
  plate-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["work"]
    environment:
      PLATE_ENV: development
      PLATE_LOG_LEVEL: info
      DATABASE_URL: "postgres://plate:plate@postgres:5432/plate?sslmode=disable"
      R2_ENDPOINT: "http://minio:9000"
      R2_REGION: "us-east-1"
      R2_ACCESS_KEY_ID: "plate"
      R2_SECRET_ACCESS_KEY: "plate-secret"
      R2_DEFAULT_BUCKET: "plate"
      PLATE_S3_PATH_STYLE: "true"
      PLATE_WORKER_SCRATCH_DIR: "/scratch"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  plate-pgdata:
  plate-miniodata:
