# Plate API — PRODUCTION (Tier 4). The `plate-*` app set that Uri's live site and the
# demo both run on. Deploys the API (`plate serve`); the worker is a SEPARATE app
# (deploy/fly.worker.plate.toml). Two apps, not two process groups, so each scales and
# sizes independently: the API is light and latency-sensitive (it also serves the
# granted-mode /v1/download byte-edge redirect), the worker is heavy ffmpeg compute.
#
# This is the production successor to deploy/fly.api.toml (plate-demo-api). Differences:
#   - app = "plate-api" (was plate-demo-api)
#   - NO PLATE_ALLOW_THROWAWAY_KEYS — prod uses the real Phase-B keypair; the
#     known-throwaway-key boot guard MUST be armed (a real client on real keys).
#   - [env] carries the `plate` bucket + plate-media/plate-img hosts (below).
#
# ⚠️ Secrets are NEVER committed. They live in Infisical and are pushed to Fly with a
# script; see the checklist at the end and docs/SECRETS.md.

app = "esf-plate-api"
primary_region = "iad"  # co-locate with Supabase (us-east-1) — the /download grant
                        # liveness lookup and every store query hit Postgres in-region.

[build]
  # Path is relative to THIS config file's dir (deploy/), so ../ reaches the repo
  # root where the Dockerfiles live. Deploy with the repo root as the build
  # context: `fly deploy . -c deploy/fly.api.plate.toml` (the Dockerfiles COPY . .
  # the whole Go module, so the context MUST be the root, not deploy/).
  dockerfile = "../Dockerfile"  # the API image (no ffmpeg)

[env]
  PLATE_ENV = "production"
  PLATE_LOG_LEVEL = "info"
  PLATE_HTTP_ADDR = ":8080"
  # NO PLATE_ALLOW_THROWAWAY_KEYS here (unlike the demo): prod runs on a freshly
  # generated keypair (Phase B), so the throwaway-key boot guard stays ARMED. Setting
  # it would defeat the guard that protects a real client's credential.

  # Delivery hosts. The public image host is the CDN-fronted presets-only imgproxy
  # (Cloudflare → esf-plate-imgproxy.fly.dev, cache rule): PUBLIC image URLs only.
  # Granted (expiring) image URLs go to the separate pr+exp imgproxy
  # (deploy/fly.imgproxy-granted.plate.toml); it MUST differ from the public host
  # (boot refuses). R2_PUBLIC_BASE is the `plate` bucket's A/V public custom domain
  # (loops/details/original bytes); PLATE_DOWNLOAD_BASE is this API's own public base.
  IMGPROXY_BASE_URL = "https://plate-img.everysinglefile.com"
  IMGPROXY_GRANTED_BASE_URL = "https://esf-plate-imgproxy-granted.fly.dev"
  R2_PUBLIC_BASE = "https://plate-media.everysinglefile.com"
  PLATE_DOWNLOAD_BASE = "https://plate-api.everysinglefile.com"
  PLATE_GRANTED_URL_TTL = "90s"  # granted URL lifetime; boot refuses anything over 120s

  # R2 (same account as the demo; the keys are secrets, below). The bucket is the
  # prod `plate` bucket, NOT plate-demo.
  R2_ENDPOINT = "https://87c7daae690b39a2efedf6ef10773606.r2.cloudflarestorage.com"
  R2_REGION = "auto"
  R2_DEFAULT_BUCKET = "plate"

  # Token policy. A security guard: with `true` the API refuses to boot while any
  # trusted key in PLATE_JWT_PUBLIC_KEYS has no account binding in
  # PLATE_JWT_KEY_ACCOUNTS (an unbound key could sign for ANY account). Committed
  # here so that turning it off is a reviewed change, not a quiet `fly secrets` edit.
  PLATE_JWT_REQUIRE_KEY_BINDING = "true"

# Public HTTP service. Unlike the worker, the API serves requests — presign,
# finalize, resolve, and the /v1/download redirect.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # scale to zero when idle
  auto_start_machines = true    # wake on the first request
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/v1/readyz"          # REAL (Tier 1 monitoring): db ping + storage HEAD → 503 "down"
                                 # (pulls the machine from routing); worker-heartbeat / no-progress
                                 # problems are 200 "degraded" so a dead worker never unroutes the
                                 # API. The EXTERNAL monitor alerts on non-200 OR status != ok.
                                 # NOTE (Tier 4): between deploy and Phase B2, the API has NO JWT key
                                 # material and 401s every token — that is EXPECTED and does NOT affect
                                 # readyz (token validation is not a readyz check). readyz is 200/ok.
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  # The API is light: no ffmpeg, just HTTP + Postgres + presign/redirect. A shared
  # CPU is fine here (the performance-CPU rule is a WORKER constraint — ffmpeg on a
  # throttled vCPU crawls; the API does no such work).
  size = "shared-cpu-1x"
  memory = "512mb"

# ── Secrets checklist ─────────────────────────────────────────────────────────
# Secrets are NEVER in this file. These eight live in Infisical (project `plate`,
# env `prod`) and are pushed to Fly with ~/Dev/registry/scripts/secrets/infisical-to-fly.sh;
# never `fly secrets set` a value by hand. See docs/SECRETS.md.
#   DATABASE_URL                 the IPv4 SESSION pooler DSN (direct host is IPv6-only)
#   R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY   the R2 write credential
#   PLATE_DELIVERY_SIGNING_KEY   HMAC secret for /v1/download
#   IMGPROXY_KEY IMGPROXY_SALT   hex; MUST match esf-plate-imgproxy and
#                                esf-plate-imgproxy-granted
#   PLATE_JWT_PUBLIC_KEYS        the trusted named-key set `kid=<b64pub>,…` (the current
#                                kids are in Infisical)
#   PLATE_JWT_KEY_ACCOUNTS       key → account binding `kid=<account>|<prefix>*,…`; every
#                                trusted kid needs one (PLATE_JWT_REQUIRE_KEY_BINDING above)
# Config is in [env] above. A Fly secret with the same name OVERRIDES it silently,
# so none of the [env] names may also exist as a Fly secret.
# Optional tunables (safe defaults, not set):
#   PLATE_GRANT_CACHE_TTL, PLATE_UPLOAD_URL_TTL, PLATE_JWT_ISSUER, PLATE_JWT_AUDIENCE
