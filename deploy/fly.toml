# Plate worker on Fly.io (spec Q4 — RESOLVED 2026-09-09: Fly.io now, host-agnostic;
# Cloud Run Jobs / a custom box remain a deploy change, not a rewrite). This
# manifest deploys ONLY the worker (`plate work`); the API has its own manifest
# (fly.api.toml), and both point at the same Postgres + R2.
#
# DEPLOYED (demo): plate-demo-worker in iad, R2 + Supabase creds set as Fly
# secrets (see the Secrets block below). Deploy + revive:
#   fly deploy . -a plate-demo-worker -c deploy/fly.toml
#   fly scale count worker=1 -a plate-demo-worker

app = "plate-demo-worker"  # demo instance; plate-worker reserved for prod (cf. the plate-demo bucket)
primary_region = "iad"  # co-locate with the Postgres region (spec Q4: grant/queue lookups in-region)

[build]
  # Relative to deploy/; ../ reaches the repo root. Deploy with the repo root as
  # context: `fly deploy . -c deploy/fly.toml` (Dockerfile.worker COPYs the module).
  dockerfile = "../Dockerfile.worker"

[processes]
  worker = "work"

# The transcode workload is bursty ingest, idle most of the time (spec Q4). But
# the worker ALSO runs the reconciliation sweep loop (orphaned uploads + deleted-
# asset purge) on a ticker in-process — and scaling to zero would SILENTLY stop
# reconciliation, letting orphaned R2 objects and marked-deleted bytes accumulate
# forever with no error. So keep one machine always running. This is NOT a latency
# setting; it is what keeps the sweeps alive (designer 2026-09-10). If the sweeps
# ever move to a separate scheduled machine, this can go back to scale-to-zero.
[[vm]]
  # PERFORMANCE CPU, never shared (spec Q4): ffmpeg on a throttled shared vCPU
  # crawls and would blow the duration ceilings. 2 perf CPU / 4GB — a 12-min
  # source is ~30min of compute.
  #
  # Flipped back for TIER 2 (video) on 2026-09-14, BEFORE any transcode job can
  # exist: V3 is what starts ingesting video through Plate, and the ordering is
  # deliberate — the machine must be able to do the work before anything enqueues
  # it. A 1.4GB source (the seeded "My Friend") on shared-cpu would blow the
  # lease and the ceilings. This reverses the 2026-09-14 idle-cost drop to
  # shared-cpu-1x/512mb, which was correct only while there was NO ffmpeg work
  # (the worker then ran just the 15-min reconcile sweeps and its heartbeat).
  #
  # Reversible: if video is deferred again, shared-cpu-1x/512mb is ~10× cheaper
  # and safe PROVIDED no A/V asset can reach the queue.
  size = "performance-2x"
  memory = "4gb"
# ⚠️ Keep ONE machine always up so the sweep loop runs (see above). The worker has
# no [http_service], so this is enforced at deploy with
# `fly scale count worker=1 -a plate-demo-worker` (the process group is "worker",
# not the default "app"), not an auto_stop setting.

# Scratch: prefer the machine's ephemeral disk over a Fly Volume (a Volume bills
# whether attached or not, spec Q4). PLATE_WORKER_SCRATCH_DIR is set in the image.

# Secrets (set with `fly secrets set -a plate-demo-worker …`, NEVER committed):
#   DATABASE_URL   — use the IPv4 SESSION pooler DSN (postgres.<ref>@aws-0-…pooler
#                    …:5432, ?sslmode=require). The direct db.<ref>.supabase.co host
#                    is IPv6-ONLY; the worker's SKIP LOCKED needs session semantics,
#                    which the 5432 session pooler (NOT the 6543 txn pooler) preserves.
#   R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_DEFAULT_BUCKET, R2_REGION
# The worker needs NO JWT/delivery/imgproxy keys — it pulls jobs + writes renditions;
# it never validates tokens or mints delivery URLs. ffmpeg/ffprobe are on PATH in the
# image (no PLATE_FFMPEG_PATH needed).
[env]
  PLATE_ENV = "production"
  PLATE_LOG_LEVEL = "info"
  PLATE_WORKER_CONCURRENCY = "1"
  # DEMO instance: the worker validates the same JWT key material as the API to
  # build the service, so it hits the same known-throwaway-key boot guard and
  # must opt past it identically (see fly.api.toml). A REAL prod instance must
  # NOT set this (and must use a freshly generated keypair). This line was
  # missing while the worker sat at zero machines, so the guard (PR #15) had
  # never been exercised here — the revive surfaced it.
  PLATE_ALLOW_THROWAWAY_KEYS = "true"
