# Secret scanning — this repo is PUBLIC and holds R2 credentials and a
# token-signing key. A leaked secret in public history is compromised before
# anyone notices and cannot be un-leaked by rewriting history. Scan runs on
# every push and PR, and on the full history for the default branch.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history so a secret introduced in an earlier commit is caught,
          # not just the diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # The gitleaks TOOL is free (Apache-2.0); the ACTION wrapper wants a
          # (free) license key for org/PR runs and validates it via the GitHub
          # API. The key is stored as a repo secret. Note: GitHub withholds
          # secrets from fork-triggered PRs, so a fork PR will fail this step —
          # acceptable while this repo has no outside contributors; revisit (run
          # the gitleaks binary directly instead) if it ever takes fork PRs.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
