# Secret scanning — this repo is PUBLIC and holds R2 credentials and a
# token-signing key. A leaked secret in public history is compromised before
# anyone notices and cannot be un-leaked by rewriting history. Scan runs on
# every push and PR, and on the full history for the default branch.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history so a secret introduced in an earlier commit is caught,
          # not just the diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # On pull_request events the action needs GITHUB_TOKEN to fetch the PR's
          # commits via the API — without it the step errors before scanning
          # ("GITHUB_TOKEN is now required to scan pull requests"), which is why
          # push events on main passed while PRs failed. The auto-provisioned
          # token is enough (contents:read is already granted above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For an INDIVIDUAL account no license is required (the action logs
          # "individual user. No license key is required"). Kept wired to the
          # secret so nothing breaks if the repo ever moves under an org, where
          # the (free) key IS required; it is ignored for individual repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
