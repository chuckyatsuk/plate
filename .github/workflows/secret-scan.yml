# Secret scanning — this repo is PUBLIC and holds R2 credentials and a
# token-signing key. A leaked secret in public history is compromised before
# anyone notices and cannot be un-leaked by rewriting history. Scan runs on
# every push and PR, and on the full history for the default branch.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history so a secret introduced in an earlier commit is caught,
          # not just the diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # No GITLEAKS_LICENSE: the action is free for public repos.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
